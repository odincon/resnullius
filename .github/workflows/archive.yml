# resnullius 档案员 —— 从墙外面走进来取账本。
#
# 为什么不需要任何 secret：
#   读墙走 HTTP（公开），写账本复用 actions/checkout 已配好的临时凭据。
#   VPS 上没有任何 GitHub 凭据，所以被审计的一方碰不到审计的笔。
#
# 为什么档案员代码放在仓库里：
#   这样"档案员本身是什么时候变的"也在账本里。
#   一个没人能审计的记账程序，不是审计。
#
# 两条踩过的坑，别再踩：
#   1) 这里不能出现任何引用 token/secret 的表达式 —— 写文件时会被密钥
#      脱敏过滤器替换成星号，YAML 直接解析失败（表现为 workflow 只登记
#      路径、不登记触发器，push 出一个没有日志的失败 run）。
#   2) job 级 env 里不能用 runner.* 上下文（GitHub 会拒绝解析）。

name: archive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WALL_ORIGIN: https://resnullius.run
      WALL_REPO: https://github.com/${{ github.repository }}.git
      # 就在 checkout 里干活：那里有 checkout 配好的临时凭据，所以不需要
      # 任何 token 表达式。"不信任脚下这份工作副本"这件事由下面档案员内部的
      # fetch + reset --hard origin/main 保证 —— 账本状态来自 origin，
      # 不来自 runner 的缓存。
      WALL_ARCHIVE_DIR: .
    steps:
      - uses: actions/checkout@v4

      - name: Archive
        run: python3 tools/archivist.py

      # 失败也要留证据：Actions 记录本身就是"沉默成为一个 commit"的替代物。
      - name: Failure evidence
        if: failure()
        run: |
          echo "::error::archivist failed at $(date -u +%FT%TZ). origin=$WALL_ORIGIN"
          curl -sS --max-time 15 "$WALL_ORIGIN/stats" || echo "origin unreachable"
